name: Windows runtime gate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-runtime:
    name: Windows Server 2025 x64
    runs-on: windows-2025
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        shell: pwsh
        run: npm --prefix web ci

      - name: Run native Windows runtime, race, and resource suites
        shell: pwsh
        run: ./scripts/test-windows-runtime.ps1 -RepeatCount 20

      - name: Run frontend quality gate
        shell: pwsh
        run: |
          npm --prefix web run typecheck
          npm --prefix web test
          npm --prefix web run lint
          npm --prefix web run build

      - name: Check generated contracts
        shell: bash
        run: ./scripts/check-contract.sh

      - name: Validate OpenSpec change
        shell: pwsh
        run: |
          npm install --global @fission-ai/openspec@1.3.0
          # Explicitly select the change: the name also matches its spec
          # directory and newer OpenSpec CLIs reject an ambiguous invocation.
          openspec validate --type change local-runtime-resilience --strict --no-interactive
