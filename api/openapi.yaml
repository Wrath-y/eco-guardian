        schema_version: { type: string, const: v1 }
        project_id: { $ref: '#/components/schemas/UUIDv7' }
        revision_id: { $ref: '#/components/schemas/UUIDv7' }
        config_hash: { $ref: '#/components/schemas/Hash' }
        version_manifest_hash: { $ref: '#/components/schemas/Hash' }
        scene_id: { type: string, minLength: 1 }
        scene_version: { type: string, minLength: 1 }
        scene_body_hash: { $ref: '#/components/schemas/Hash' }
        participants: { type: array, items: { type: object, additionalProperties: true } }
        actions: { type: array, items: { type: object, additionalProperties: true } }
        duration_ms: { type: integer, minimum: 0 }
        budgets: { type: object, additionalProperties: true }
        sample_count: { type: integer, minimum: 1 }
        seed: { type: integer, minimum: 0 }
        metrics: { type: array, items: { $ref: '#/components/schemas/SimulationMetricRequest' } }
    SimulationRun:
      type: object
      required: [id, job_id, revision_id, scenario_definition_id, input, input_hash, fingerprint_hash, result_hash, canonical_result, metrics, verification_refs, reproducible, reasons, created_at]
      properties:
        id: { $ref: '#/components/schemas/UUIDv7' }
        job_id: { $ref: '#/components/schemas/UUIDv7' }
        revision_id: { $ref: '#/components/schemas/UUIDv7' }
        scenario_definition_id: { $ref: '#/components/schemas/UUIDv7' }
        input: { oneOf: [{ $ref: '#/components/schemas/SimulationCapturedInput' }, { type: 'null' }] }
        input_hash: { $ref: '#/components/schemas/Hash' }
        fingerprint_hash: { $ref: '#/components/schemas/Hash' }
        result_hash: { $ref: '#/components/schemas/Hash' }
        canonical_result: { type: string, minLength: 1 }
        metrics: { type: array, items: { $ref: '#/components/schemas/SimulationMetricResult' } }
        verification_refs: { type: array, items: { $ref: '#/components/schemas/SimulationVerificationRef' } }
        reproducible: { type: boolean }
        reasons: { type: array, items: { type: string } }
        created_at: { type: string, format: date-time }
    RiskIdentity:
      type: object
      additionalProperties: false
      required: [id, version, hash]
      properties:
        id: { type: string, minLength: 1 }
        version: { type: string, minLength: 1 }
        hash: { $ref: '#/components/schemas/Hash' }
    RiskRevisionIdentity:
      type: object
      additionalProperties: false
      required: [revision_id, config_hash, version_manifest_hash]
      properties:
        revision_id: { $ref: '#/components/schemas/UUIDv7' }
        config_hash: { $ref: '#/components/schemas/Hash' }
        version_manifest_hash: { $ref: '#/components/schemas/Hash' }
    RiskBaseline:
      oneOf:
        - $ref: '#/components/schemas/RiskCurrentBaseline'
        - $ref: '#/components/schemas/RiskNoBaseline'
      discriminator: { propertyName: type, mapping: { BASELINE: '#/components/schemas/RiskCurrentBaseline', NO_BASELINE: '#/components/schemas/RiskNoBaseline' } }
    RiskCurrentBaseline:
      type: object
      additionalProperties: false
      required: [type, release_id, revision]
      properties:
        type: { type: string, const: BASELINE }
        release_id: { $ref: '#/components/schemas/UUIDv7' }
        revision: { $ref: '#/components/schemas/RiskRevisionIdentity' }
    RiskNoBaseline:
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type: { type: string, const: NO_BASELINE }
    RiskExistingThresholdSelection:
      type: object
      additionalProperties: false
      required: [type, threshold]
      properties:
        type: { type: string, const: EXISTING }
        threshold: { $ref: '#/components/schemas/RiskIdentity' }
    RiskStarterThresholdSelection:
      type: object
      additionalProperties: false
      required: [type, confirmed]
      properties:
        type: { type: string, const: STARTER }
        confirmed: { type: boolean, const: true }
    RiskModifiedStarterThresholdSelection:
      type: object
      additionalProperties: false
      required: [type, confirmed, body]
      properties:
        type: { type: string, const: MODIFIED_STARTER }
        confirmed: { type: boolean, const: true }
        body: { $ref: '#/components/schemas/RiskThresholdBody' }
    RiskThresholdSelection:
      oneOf:
        - $ref: '#/components/schemas/RiskExistingThresholdSelection'
        - $ref: '#/components/schemas/RiskStarterThresholdSelection'
        - $ref: '#/components/schemas/RiskModifiedStarterThresholdSelection'
      discriminator: { propertyName: type, mapping: { EXISTING: '#/components/schemas/RiskExistingThresholdSelection', STARTER: '#/components/schemas/RiskStarterThresholdSelection', MODIFIED_STARTER: '#/components/schemas/RiskModifiedStarterThresholdSelection' } }
    RiskThresholdEntry:
      type: object
      additionalProperties: false
      required: [scene_id, scene_version, metric_id, metric_version, balance_group, unit, direction, relative_warning, relative_block, absolute_warning, absolute_block]
      properties:
        scene_id: { type: string, minLength: 1 }
        scene_version: { type: string, minLength: 1 }
        metric_id: { type: string, minLength: 1 }
        metric_version: { type: string, minLength: 1 }
        balance_group: { type: [string, 'null'], minLength: 1 }
        unit: { type: string, minLength: 1 }
        direction: { type: string, enum: [higher_is_risk, lower_is_risk, target_range] }
        relative_warning: { $ref: '#/components/schemas/DecimalString' }
        relative_block: { $ref: '#/components/schemas/DecimalString' }
        absolute_warning: { oneOf: [{ $ref: '#/components/schemas/DecimalString' }, { type: 'null' }] }
        absolute_block: { oneOf: [{ $ref: '#/components/schemas/DecimalString' }, { type: 'null' }] }
    RiskThresholdBody:
      type: object
      additionalProperties: false
      required: [schema_version, source, assumptions, entries, structural_rule_versions]
      properties:
        schema_version: { type: string, const: v1 }
        source: { type: string, minLength: 1, maxLength: 512 }
        assumptions: { type: array, maxItems: 100, items: { type: string, minLength: 1, maxLength: 512 } }
        entries: { type: array, minItems: 1, maxItems: 500, items: { $ref: '#/components/schemas/RiskThresholdEntry' } }
        structural_rule_versions: { type: array, minItems: 1, maxItems: 100, items: { $ref: '#/components/schemas/RiskIdentity' } }
    RiskPolicyRequirement:
      type: object
      additionalProperties: false
      required: [scene_id, scene_version, metric_id, metric_version, role]
      properties:
        scene_id: { type: string, minLength: 1 }
        scene_version: { type: string, minLength: 1 }
        metric_id: { type: string, minLength: 1 }
        metric_version: { type: string, minLength: 1 }
        role: { type: string, enum: [required, optional] }
    RiskSimulationRef:
      type: object
      additionalProperties: false
      required: [run_id, result_hash]
      properties:
        run_id: { $ref: '#/components/schemas/UUIDv7' }
        result_hash: { $ref: '#/components/schemas/Hash' }
    EvaluateRiskReviewCommand:
      type: object
      additionalProperties: false
      required: [command, candidate, baseline, policy, policy_requirements, threshold, simulation_runs]
      properties:
        command: { type: string, const: evaluate }
        candidate: { $ref: '#/components/schemas/RiskRevisionIdentity' }
        baseline: { $ref: '#/components/schemas/RiskBaseline' }
        policy: { $ref: '#/components/schemas/RiskIdentity' }
        policy_requirements: { type: array, minItems: 1, maxItems: 500, items: { $ref: '#/components/schemas/RiskPolicyRequirement' } }
        threshold: { $ref: '#/components/schemas/RiskThresholdSelection' }
        simulation_runs: { type: array, minItems: 1, maxItems: 500, items: { $ref: '#/components/schemas/RiskSimulationRef' }, description: Ordered immutable candidate refs followed by exact baseline refs required by the policy. }
    RiskDecisionItemRef:
      type: object
      additionalProperties: false
      required: [item_id, item_hash]
      properties:
        item_id: { type: string, minLength: 1 }
        item_hash: { $ref: '#/components/schemas/Hash' }
    RecordNumericDecisionCommand:
      type: object
      additionalProperties: false
      required: [command, source_report_id, source_calculation_hash, eligible_items, reason]
      properties:
        command: { type: string, const: record_numeric_decision }
        source_report_id: { $ref: '#/components/schemas/UUIDv7' }
        source_calculation_hash: { $ref: '#/components/schemas/Hash' }
        eligible_items: { type: array, minItems: 1, maxItems: 500, items: { $ref: '#/components/schemas/RiskDecisionItemRef' } }
        reason: { type: string, minLength: 1, maxLength: 2000 }
    RiskReviewCommand:
      oneOf:
        - $ref: '#/components/schemas/EvaluateRiskReviewCommand'
        - $ref: '#/components/schemas/RecordNumericDecisionCommand'
      discriminator: { propertyName: command, mapping: { evaluate: '#/components/schemas/EvaluateRiskReviewCommand', record_numeric_decision: '#/components/schemas/RecordNumericDecisionCommand' } }
    RiskJobAccepted:
      type: object
      additionalProperties: false
      required: [job, location]
      properties:
        job: { $ref: '#/components/schemas/Job' }
        location: { type: string, format: uri-reference }
    RiskSubject:
      type: object
      additionalProperties: false
      required: [type, entity_kind, balance_group, stable_id, members]
      properties:
        type: { type: string, enum: [cohort, singleton] }
        entity_kind: { type: string, minLength: 1 }
        balance_group: { type: [string, 'null'] }
        stable_id: { oneOf: [{ $ref: '#/components/schemas/UUIDv7' }, { type: 'null' }] }
        members: { type: array, minItems: 1, items: { $ref: '#/components/schemas/UUIDv7' } }
    RiskMetricUnavailableReason:
      type: object
      additionalProperties: false
      required: [code, missing, message]
      properties:
        code: { type: string, minLength: 1 }
        missing: { type: array, items: { type: string, minLength: 1 } }
        message: { type: string, minLength: 1 }
    RiskMetricValue:
      type: object
      additionalProperties: false
      required: [status, value, confidence_low, confidence_high, unavailable, run_id, result_hash]
      properties:
        status: { type: string, enum: [AVAILABLE, UNAVAILABLE] }
        value: { oneOf: [{ $ref: '#/components/schemas/DecimalString' }, { type: 'null' }] }
        confidence_low: { oneOf: [{ $ref: '#/components/schemas/DecimalString' }, { type: 'null' }] }
        confidence_high: { oneOf: [{ $ref: '#/components/schemas/DecimalString' }, { type: 'null' }] }
        unavailable: { oneOf: [{ $ref: '#/components/schemas/RiskMetricUnavailableReason' }, { type: 'null' }] }
        run_id: { $ref: '#/components/schemas/UUIDv7' }
        result_hash: { $ref: '#/components/schemas/Hash' }
    RiskMetricEvidence:
      type: object
      additionalProperties: false
      required: [scene_id, scene_version, metric_id, metric_version, unit, direction, target_range, absolute_threshold, subject, candidate, baseline, signed_delta, risk_delta, relative_risk, assumptions]
      properties:
        scene_id: { type: string, minLength: 1 }
        scene_version: { type: string, minLength: 1 }
        metric_id: { type: string, minLength: 1 }
        metric_version: { type: string, minLength: 1 }
        unit: { type: string, minLength: 1 }
        direction: { type: string, enum: [higher_is_risk, lower_is_risk, target_range] }
        target_range:
          oneOf:
            - type: object
              additionalProperties: false
              required: [lower, upper, bounds]
              properties:
                lower: { $ref: '#/components/schemas/DecimalString' }
                upper: { $ref: '#/components/schemas/DecimalString' }
                bounds: { type: string, const: inclusive }
            - type: 'null'
        absolute_threshold: { oneOf: [{ $ref: '#/components/schemas/DecimalString' }, { type: 'null' }] }
        subject: { $ref: '#/components/schemas/RiskSubject' }
        candidate: { $ref: '#/components/schemas/RiskMetricValue' }
        baseline: { oneOf: [{ $ref: '#/components/schemas/RiskMetricValue' }, { type: 'null' }] }
        signed_delta: { oneOf: [{ $ref: '#/components/schemas/DecimalString' }, { type: 'null' }] }
        risk_delta: { oneOf: [{ $ref: '#/components/schemas/DecimalString' }, { type: 'null' }] }
        relative_risk: { oneOf: [{ $ref: '#/components/schemas/DecimalString' }, { type: 'null' }], description: Null for NO_BASELINE, zero baseline or non-comparable evidence. }
        assumptions: { type: array, items: { type: string } }
    RiskStructuralEvidence:
      type: object
      additionalProperties: false
      required: [type, rule, entity_id, field_path, ordinal, fingerprint]
      properties:
        type: { type: string, enum: [VALIDATION_ISSUE, NEW_MULTIPLIER, REPEATED_MULTIPLIER] }
        rule: { $ref: '#/components/schemas/RiskIdentity' }
        entity_id: { $ref: '#/components/schemas/UUIDv7' }
        field_path: { type: string, pattern: '^/' }
        ordinal: { type: integer, minimum: 0 }
        fingerprint: { $ref: '#/components/schemas/Hash' }
    RiskReviewItem:
      type: object
      additionalProperties: false
      required: [id, ordinal, kind, role, comparison_status, severity, reason, rule, override_classification, overridable, evidence_hash, metric_evidence, structural_evidence, item_hash]
      properties:
        id: { type: string, minLength: 1 }
        ordinal: { type: integer, minimum: 0 }
        kind: { type: string, enum: [metric, structural] }
        role: { type: string, enum: [required, optional] }
        comparison_status: { type: string, enum: [COMPARABLE, NOT_COMPARABLE, UNAVAILABLE, STALE] }
        severity: { type: [string, 'null'], enum: [BLOCK, WARNING, INFO, null] }
        reason: { type: [string, 'null'] }
        rule: { $ref: '#/components/schemas/RiskIdentity' }
        override_classification: { type: string, enum: [NUMERIC_ELIGIBLE, NON_OVERRIDABLE] }
        overridable: { type: boolean, description: True only for a stored numeric BLOCK eligible for a separate immutable decision report. }
        evidence_hash: { $ref: '#/components/schemas/Hash' }
        metric_evidence: { oneOf: [{ $ref: '#/components/schemas/RiskMetricEvidence' }, { type: 'null' }] }
        structural_evidence: { oneOf: [{ $ref: '#/components/schemas/RiskStructuralEvidence' }, { type: 'null' }] }
        item_hash: { $ref: '#/components/schemas/Hash' }
    RiskThresholdProjection:
      type: object
      additionalProperties: false
      required: [identity, enabled, body_hash, source, assumptions, entries]
      properties:
        identity: { $ref: '#/components/schemas/RiskIdentity' }
        enabled: { type: boolean }
        body_hash: { $ref: '#/components/schemas/Hash' }
        source: { type: string, minLength: 1 }
        assumptions: { type: array, items: { type: string } }
        entries: { type: array, items: { $ref: '#/components/schemas/RiskThresholdEntry' } }
    RiskReadTimeProjection:
      type: object
      additionalProperties: false
      required: [freshness, freshness_reasons, gate_state, gate_item_ids, active_baseline_release_id, release_audit_url, impact_evidence_refs]
      properties:
        freshness: { type: string, enum: [FRESH, STALE, UNAVAILABLE] }
        freshness_reasons: { type: array, items: { type: string, minLength: 1 } }
        gate_state: { type: string, enum: [PASS, WARNING, BLOCK, UNAVAILABLE, STALE] }
        gate_item_ids: { type: array, items: { type: string, minLength: 1 } }
        active_baseline_release_id: { oneOf: [{ $ref: '#/components/schemas/UUIDv7' }, { type: 'null' }] }
        release_audit_url: { type: [string, 'null'], format: uri-reference }
        impact_evidence_refs: { type: array, items: { $ref: '#/components/schemas/RiskIdentity' }, description: Optional exact impact-evidence references excluded from calculation and severity hashes. }
    RiskReview:
      type: object
      additionalProperties: false
      required: [id, report_kind, schema_version, project_id, candidate, baseline, policy, threshold, validation, implementations, simulation_run_ids, input_hash, calculation_hash, explanation_evidence_hash, report_hash, source_report_id, decision_item_ids, decision_reason, items, read_time, created_at]
      properties:
        id: { $ref: '#/components/schemas/UUIDv7' }
        report_kind: { type: string, enum: [calculation, decision] }
        schema_version: { type: string, const: v1 }
        project_id: { $ref: '#/components/schemas/UUIDv7' }
        candidate: { $ref: '#/components/schemas/RiskRevisionIdentity' }
        baseline: { $ref: '#/components/schemas/RiskBaseline' }
        policy: { $ref: '#/components/schemas/RiskIdentity' }
        threshold: { $ref: '#/components/schemas/RiskThresholdProjection' }
        validation: { $ref: '#/components/schemas/RiskIdentity' }
        implementations: { type: array, minItems: 1, items: { $ref: '#/components/schemas/RiskIdentity' } }
        simulation_run_ids: { type: array, minItems: 1, items: { $ref: '#/components/schemas/UUIDv7' } }
        input_hash: { $ref: '#/components/schemas/Hash' }
        calculation_hash: { $ref: '#/components/schemas/Hash' }
        explanation_evidence_hash: { $ref: '#/components/schemas/Hash' }
        report_hash: { $ref: '#/components/schemas/Hash' }
        source_report_id: { oneOf: [{ $ref: '#/components/schemas/UUIDv7' }, { type: 'null' }] }
        decision_item_ids: { type: array, items: { type: string, minLength: 1 } }
        decision_reason: { type: [string, 'null'] }
        items: { type: array, items: { $ref: '#/components/schemas/RiskReviewItem' } }
        read_time: { $ref: '#/components/schemas/RiskReadTimeProjection' }
        created_at: { type: string, format: date-time }
    ReleaseDisabledReason:
      type: object
      required: [capability_id, gate_id, code]
      properties:
        capability_id: { type: string, minLength: 1 }
        gate_id: { type: string, minLength: 1 }
        code: { type: string, enum: [MISSING, INCOMPATIBLE, UNAVAILABLE] }
        detail: { type: [string, 'null'] }
    ReleaseCapability:
      type: object
      required: [enabled, disabled_reasons]
      properties:
        enabled: { type: boolean, description: Server-authoritative release-entry state; it is never computed by the client. }
        disabled_reasons: { type: array, items: { $ref: '#/components/schemas/ReleaseDisabledReason' } }
    RuntimeCapabilities:
      type: object
      required: [release, graph]
      description: Safe runtime availability projection. It deliberately omits backup credentials, service endpoints, and client-computed Gate pass state.
      properties:
        release: { $ref: '#/components/schemas/ReleaseCapability' }
        graph: { $ref: '#/components/schemas/GraphRuntimeCapability' }
    GraphRuntimeCapability:
      type: object
      required: [available, compatible, required_capabilities, degradations, disabled_reasons, release_disabled_reasons]
      description: Server-authoritative Graph provider health and compatibility. Graph release readiness remains a Gate result for an exact candidate revision.
      properties:
        available: { type: boolean }
        compatible: { type: boolean }
        required_capabilities: { type: array, items: { type: string } }
        degradations: { type: array, items: { type: string } }
        disabled_reasons: { type: array, items: { type: string } }
        release_disabled_reasons: { type: array, items: { type: string }, description: Same stable Graph capability reasons consumed when Graph disables release admission. }
        observed_at: { type: [string, 'null'], format: date-time }
    LocalValidationSummary:
      type: object
      required: [run_id, scope, error, block, warning, info]
      properties:
        run_id: { $ref: '#/components/schemas/UUIDv7' }
        scope: { type: string, const: LOCAL }
        error: { type: integer, minimum: 0 }
        block: { type: integer, minimum: 0 }
        warning: { type: integer, minimum: 0 }
        info: { type: integer, minimum: 0 }
    SaveEntityResponse:
      type: object
      required: [entity, revision]
      properties:
        entity: { $ref: '#/components/schemas/Entity' }
        revision: { $ref: '#/components/schemas/RevisionSummary' }
    ValidationScope: { type: string, enum: [LOCAL, FULL] }
    ValidationSource:
      oneOf:
        - $ref: '#/components/schemas/WorkingValidationSource'
        - $ref: '#/components/schemas/RevisionValidationSource'
      discriminator: { propertyName: type }
    WorkingValidationSource:
      type: object
      required: [type]
      properties: { type: { const: working } }
    RevisionValidationSource:
      type: object
      required: [type, revision_id]
      properties: { type: { const: revision }, revision_id: { $ref: '#/components/schemas/UUIDv7' } }
    VersionManifest:
      type: object
      required: [schema, dsl, registry, numeric_policy]
      properties:
        schema: { type: string }
        dsl: { type: string }
        registry: { type: string }
        numeric_policy: { type: string }
    FormulaSpan:
      type: object
      required: [start_byte, end_byte]
      properties:
        start_byte: { type: integer, minimum: 0, description: UTF-8 byte offset, inclusive. }
        end_byte: { type: integer, minimum: 1, description: UTF-8 byte offset, exclusive. }
    ValidationSeverity: { type: string, enum: [ERROR, BLOCK, WARNING, INFO] }
    SeveritySummary:
      type: object
      required: [error, block, warning, info]
      properties:
        error: { type: integer, minimum: 0 }
        block: { type: integer, minimum: 0 }
        warning: { type: integer, minimum: 0 }
        info: { type: integer, minimum: 0 }
    ValidationIssue:
      type: object
      required: [severity, code, entity_id, field_path, message_key, message, fingerprint]
      properties:
        severity: { $ref: '#/components/schemas/ValidationSeverity' }
        code: { type: string }
        entity_id: { $ref: '#/components/schemas/UUIDv7' }
        field_path: { type: string, description: RFC 6901 JSON Pointer. }
        formula_span: { oneOf: [{ $ref: '#/components/schemas/FormulaSpan' }, { type: 'null' }] }
        ordinal: { type: integer, minimum: 0 }
        message_key: { type: string }
        message: { type: string, description: Readable server-derived presentation text; excluded from validation identity and result hashes. }
        message_params: { type: object, additionalProperties: { type: string } }
        fix_hint_key: { type: string }
        fix_hint: { type: string, description: Readable server-derived presentation hint; excluded from validation identity and result hashes. }
        evidence: { type: object, additionalProperties: { type: string } }
        fingerprint: { $ref: '#/components/schemas/Hash' }
    CreateValidationRunRequest:
      type: object
      required: [source, scope]
      properties:
        source: { $ref: '#/components/schemas/ValidationSource' }
        scope: { $ref: '#/components/schemas/ValidationScope' }
        entity_ids: { type: array, items: { $ref: '#/components/schemas/UUIDv7' }, description: Required only for LOCAL; forbidden for FULL. }
    ValidationRun:
      type: object
      required: [id, source, scope, input_hash, versions, status, summary, result_hash, created_at, issues]
      properties:
        id: { $ref: '#/components/schemas/UUIDv7' }
        source: { $ref: '#/components/schemas/ValidationSource' }
        scope: { $ref: '#/components/schemas/ValidationScope' }
        input_hash: { $ref: '#/components/schemas/Hash' }
        versions: { $ref: '#/components/schemas/VersionManifest' }
        status: { type: string, const: completed }
        summary: { $ref: '#/components/schemas/SeveritySummary' }
        result_hash: { $ref: '#/components/schemas/Hash' }
        created_at: { type: string, format: date-time }
        issues: { type: array, items: { $ref: '#/components/schemas/ValidationIssue' } }
    ValidationGateResult: { type: string, enum: [PASS, REQUIRES_VALIDATION, BLOCKED] }
    EntityPage:
      type: object
      required: [items]
      properties:
        items: { type: array, maxItems: 200, items: { $ref: '#/components/schemas/Entity' } }
        next_cursor: { type: [string, 'null'] }
    Problem:
      type: object
      required: [type, title, status, code, retryable, request_id]
      properties:
        type: { type: string, format: uri-reference }
        title: { type: string }
        status: { type: integer }
