        subject: { $ref: '#/components/schemas/RiskSubject' }
        candidate: { $ref: '#/components/schemas/RiskMetricValue' }
        baseline: { oneOf: [{ $ref: '#/components/schemas/RiskMetricValue' }, { type: 'null' }] }
        signed_delta: { oneOf: [{ $ref: '#/components/schemas/DecimalString' }, { type: 'null' }] }
        risk_delta: { oneOf: [{ $ref: '#/components/schemas/DecimalString' }, { type: 'null' }] }
