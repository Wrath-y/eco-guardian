openapi: 3.1.0
info:
  title: Eco Guardian local API
  version: 1.0.0
  description: Loopback-only contract for local configuration authoring.
servers:
  - url: /api/v1
paths:
  /project-selections:
    post:
      operationId: selectProjectDirectory
      responses:
        '201': { description: Directory selected, content: { application/json: { schema: { $ref: '#/components/schemas/ProjectSelection' } } } }
        default: { $ref: '#/components/responses/Problem' }
  /projects:
    post:
      operationId: openProject
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/OpenProjectRequest' } } } }
      responses:
        '200': { description: Project is active, content: { application/json: { schema: { $ref: '#/components/schemas/Project' } } } }
        '201': { description: Project created and active, content: { application/json: { schema: { $ref: '#/components/schemas/Project' } } } }
        default: { $ref: '#/components/responses/Problem' }
  /projects/current:
    get:
      operationId: getCurrentProject
      responses:
        '200': { description: Active project, content: { application/json: { schema: { $ref: '#/components/schemas/Project' } } } }
        '404': { $ref: '#/components/responses/Problem' }
  /projects/recent:
    get:
      operationId: listRecentProjects
      responses:
        '200': { description: Recent project metadata, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Project' } } } } }
        default: { $ref: '#/components/responses/Problem' }
  /projects/recent/{id}:
    post:
      operationId: openRecentProject
      parameters: [ { $ref: '#/components/parameters/ProjectID' } ]
      responses:
        '200': { description: Recent project opened and active, content: { application/json: { schema: { $ref: '#/components/schemas/Project' } } } }
        default: { $ref: '#/components/responses/Problem' }
  /projects/close:
    post:
      operationId: closeProject
      responses:
        '204': { description: Project closed }
        default: { $ref: '#/components/responses/Problem' }
  /schemas/entities/{kind}:
    get:
      operationId: getEntitySchema
      parameters: [ { $ref: '#/components/parameters/Kind' } ]
      responses:
        '200': { description: Compiled registry schema, content: { application/json: { schema: { $ref: '#/components/schemas/EntitySchema' } } } }
        default: { $ref: '#/components/responses/Problem' }
  /entities/{kind}:
    get:
      operationId: listEntities
      parameters:
        - { $ref: '#/components/parameters/Kind' }
        - { name: query, in: query, schema: { type: string, maxLength: 256 } }
        - { name: cursor, in: query, description: Opaque continuation cursor, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, default: 50, minimum: 1, maximum: 200 } }
      responses:
        '200': { description: Stable entity page, content: { application/json: { schema: { $ref: '#/components/schemas/EntityPage' } } } }
        default: { $ref: '#/components/responses/Problem' }
    post:
      operationId: createEntity
      parameters: [ { $ref: '#/components/parameters/Kind' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/EntityDraft' } } } }
      responses:
        '201':
          description: Entity created in a new revision
          headers: { ETag: { $ref: '#/components/headers/EntityETag' } }
          content: { application/json: { schema: { $ref: '#/components/schemas/SaveEntityResponse' } } }
        default: { $ref: '#/components/responses/Problem' }
  /entities/{kind}/{id}:
    get:
      operationId: getEntity
      parameters: [ { $ref: '#/components/parameters/Kind' }, { $ref: '#/components/parameters/EntityID' } ]
      responses:
        '200':
          description: Entity
          headers: { ETag: { $ref: '#/components/headers/EntityETag' } }
          content: { application/json: { schema: { $ref: '#/components/schemas/Entity' } } }
        default: { $ref: '#/components/responses/Problem' }
    patch:
      operationId: patchEntity
      parameters:
        - { $ref: '#/components/parameters/Kind' }
        - { $ref: '#/components/parameters/EntityID' }
        - { $ref: '#/components/parameters/IfMatch' }
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/EntityPatch' } } } }
      responses:
        '200':
          description: Entity updated in a new revision
          headers: { ETag: { $ref: '#/components/headers/EntityETag' } }
          content: { application/json: { schema: { $ref: '#/components/schemas/SaveEntityResponse' } } }
        default: { $ref: '#/components/responses/Problem' }
    delete:
      operationId: deleteEntity
      parameters:
        - { $ref: '#/components/parameters/Kind' }
        - { $ref: '#/components/parameters/EntityID' }
        - { $ref: '#/components/parameters/IfMatch' }
      responses:
        '200': { description: Entity archived in a new revision, content: { application/json: { schema: { $ref: '#/components/schemas/SaveEntityResponse' } } } }
        default: { $ref: '#/components/responses/Problem' }
  /validation/runs:
    post:
      operationId: createValidationRun
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateValidationRunRequest' } } } }
      responses:
        '201': { description: Synchronously completed immutable validation run, content: { application/json: { schema: { $ref: '#/components/schemas/ValidationRun' } } } }
        default: { $ref: '#/components/responses/Problem' }
  /validation/runs/{id}:
    get:
      operationId: getValidationRun
      parameters: [ { $ref: '#/components/parameters/ValidationRunID' } ]
      responses:
        '200': { description: Immutable validation result, content: { application/json: { schema: { $ref: '#/components/schemas/ValidationRun' } } } }
        default: { $ref: '#/components/responses/Problem' }
  /revisions:
    get:
      operationId: listRevisions
      parameters:
        - { name: cursor, in: query, schema: { type: string }, description: Opaque stable continuation cursor. }
        - { name: limit, in: query, schema: { type: integer, default: 50, minimum: 1, maximum: 200 } }
      responses:
        '200': { description: Stable revision history page, content: { application/json: { schema: { $ref: '#/components/schemas/RevisionPage' } } } }
        default: { $ref: '#/components/responses/Problem' }
    post:
      operationId: createRevision
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateRevisionRequest' } } } }
      responses:
        '201': { description: Immutable checkpoint or forward-rollback revision created, content: { application/json: { schema: { $ref: '#/components/schemas/RevisionDetail' } } } }
        default: { $ref: '#/components/responses/Problem' }
  /revisions/{id}:
    get:
      operationId: getRevision
      parameters: [ { $ref: '#/components/parameters/RevisionID' } ]
      responses:
        '200': { description: Immutable revision detail and derived status timeline, content: { application/json: { schema: { $ref: '#/components/schemas/RevisionDetail' } } } }
        default: { $ref: '#/components/responses/Problem' }
  /revisions/{id}/diff:
    get:
      operationId: getRevisionDiff
      parameters:
        - { $ref: '#/components/parameters/RevisionID' }
        - { name: base, in: query, required: true, schema: { $ref: '#/components/schemas/UUIDv7' }, description: Immutable base revision; no server-side fallback is permitted. }
      responses:
        '200': { description: Deterministic structured revision diff, content: { application/json: { schema: { $ref: '#/components/schemas/RevisionDiff' } } } }
        default: { $ref: '#/components/responses/Problem' }
  /revisions/{id}/graph-sync:
    post:
      operationId: ensureGraphSync
      description: Ensures the exact immutable revision has one admitted Graph sync Job. A retry request requires a stable Idempotency-Key and never changes the revision or snapshot identity.
      parameters:
        - { $ref: '#/components/parameters/RevisionID' }
        - { $ref: '#/components/parameters/GraphRetryIdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GraphSyncRequest' }
      responses:
        '202':
          description: Existing or newly admitted durable Graph Job. The Location header and job URLs identify the same Job.
          headers:
            Location: { required: true, schema: { type: string, format: uri-reference } }
          content:
            application/json: { schema: { $ref: '#/components/schemas/GraphSyncJobAccepted' } }
        default: { $ref: '#/components/responses/Problem' }
  /revisions/{id}/graph-status:
    get:
      operationId: getGraphStatus
      description: Reads only the exact revision's persisted Graph observations. It never starts sync, rebuilds a projection, mutates a provider Snapshot, or falls back to another revision.
      parameters: [ { $ref: '#/components/parameters/RevisionID' } ]
      responses:
        '200': { description: Exact revision Graph state and last safe provider observation, content: { application/json: { schema: { $ref: '#/components/schemas/GraphStatus' } } } }
        default: { $ref: '#/components/responses/Problem' }
  /release-policies:
    get:
      operationId: listReleasePolicies
      parameters:
        - { name: cursor, in: query, schema: { type: string }, description: Opaque stable continuation cursor. }
        - { name: limit, in: query, schema: { type: integer, default: 50, minimum: 1, maximum: 200 } }
      responses:
        '200': { description: Immutable release-policy history, content: { application/json: { schema: { $ref: '#/components/schemas/ReleasePolicyPage' } } } }
        default: { $ref: '#/components/responses/Problem' }
    post:
      operationId: createReleasePolicy
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateReleasePolicyRequest' } } } }
      responses:
        '201': { description: New immutable release-policy version, content: { application/json: { schema: { $ref: '#/components/schemas/ReleasePolicy' } } } }
        default: { $ref: '#/components/responses/Problem' }
  /releases:
    get:
      operationId: listReleases
      parameters:
        - { name: cursor, in: query, schema: { type: string }, description: Opaque stable continuation cursor. }
        - { name: limit, in: query, schema: { type: integer, default: 50, minimum: 1, maximum: 200 } }
      responses:
        '200': { description: Read-only release history, content: { application/json: { schema: { $ref: '#/components/schemas/ReleasePage' } } } }
        default: { $ref: '#/components/responses/Problem' }
    post:
      operationId: createRelease
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateReleaseRequest' } } } }
      responses:
        '202': { description: Release preflight accepted and durable Job queued, content: { application/json: { schema: { $ref: '#/components/schemas/ReleaseJobAccepted' } } } }
        default: { $ref: '#/components/responses/Problem' }
  /releases/{id}:
    get:
      operationId: getRelease
      parameters: [ { $ref: '#/components/parameters/ReleaseID' } ]
      responses:
        '200': { description: Immutable release detail, content: { application/json: { schema: { $ref: '#/components/schemas/ReleaseDetail' } } } }
        default: { $ref: '#/components/responses/Problem' }
  /jobs/{id}:
    get:
      operationId: getJob
      parameters: [ { $ref: '#/components/parameters/JobID' } ]
      responses:
        '200': { description: Durable registered Job state; clients may poll using poll_after_ms, content: { application/json: { schema: { $ref: '#/components/schemas/Job' } } } }
        default: { $ref: '#/components/responses/Problem' }
  /jobs/{id}/events:
    get:
      operationId: streamJobEvents
      parameters:
        - { $ref: '#/components/parameters/JobID' }
        - { $ref: '#/components/parameters/LastEventID' }
      responses:
        '200': { description: Persisted Job events in ordinal order, content: { text/event-stream: { schema: { type: string } } } }
        default: { $ref: '#/components/responses/Problem' }
  /jobs/{id}/cancel:
    post:
      operationId: cancelJob
      parameters: [ { $ref: '#/components/parameters/JobID' } ]
      responses:
        '202': { description: Cancellation intent persisted for a registered Job; feature workers resolve it at their documented safe boundary, content: { application/json: { schema: { $ref: '#/components/schemas/Job' } } } }
        default: { $ref: '#/components/responses/Problem' }
  /simulation-jobs:
    post:
      operationId: createSimulationJob
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateSimulationJobRequest' } } } }
      responses:
        '202':
          description: Existing or newly admitted durable simulation Job.
          headers: { Location: { required: true, schema: { type: string, format: uri-reference } } }
          content: { application/json: { schema: { $ref: '#/components/schemas/SimulationJobAccepted' } } }
        default: { $ref: '#/components/responses/Problem' }
  /simulation-runs/{id}:
    get:
      operationId: getSimulationRun
      parameters: [ { $ref: '#/components/parameters/SimulationRunID' } ]
      responses:
        '200': { description: Immutable simulation result with read-time reproducibility projection., content: { application/json: { schema: { $ref: '#/components/schemas/SimulationRun' } } } }
        default: { $ref: '#/components/responses/Problem' }
  /risk-reviews:
    post:
      operationId: createRiskReview
      description: Admits either a deterministic evaluation or a new immutable numeric decision report. Severity, Gate state and override outcomes are always server-derived.
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/RiskReviewCommand' } } }
      responses:
        '202':
          description: Existing or newly admitted durable risk Job.
          headers: { Location: { required: true, schema: { type: string, format: uri-reference } } }
          content: { application/json: { schema: { $ref: '#/components/schemas/RiskJobAccepted' } } }
        default: { $ref: '#/components/responses/Problem' }
  /risk-reviews/{id}:
    get:
      operationId: getRiskReview
      description: Reads one immutable calculation or decision report plus read-time freshness, Gate and release-audit links. Read-time projections never alter stored calculation hashes.
      parameters: [ { $ref: '#/components/parameters/RiskReviewID' } ]
      responses:
        '200': { description: Immutable risk review detail., content: { application/json: { schema: { $ref: '#/components/schemas/RiskReview' } } } }
        default: { $ref: '#/components/responses/Problem' }
  /runtime/capabilities:
    get:
      operationId: getRuntimeCapabilities
      responses:
        '200': { description: Server-authoritative release capability state, content: { application/json: { schema: { $ref: '#/components/schemas/RuntimeCapabilities' } } } }
        default: { $ref: '#/components/responses/Problem' }
components:
  parameters:
    Kind: { name: kind, in: path, required: true, schema: { $ref: '#/components/schemas/EntityKind' } }
    EntityID: { name: id, in: path, required: true, schema: { $ref: '#/components/schemas/UUIDv7' } }
    ProjectID: { name: id, in: path, required: true, schema: { $ref: '#/components/schemas/UUIDv7' } }
    ValidationRunID: { name: id, in: path, required: true, schema: { $ref: '#/components/schemas/UUIDv7' } }
    RevisionID: { name: id, in: path, required: true, schema: { $ref: '#/components/schemas/UUIDv7' } }
    ReleaseID: { name: id, in: path, required: true, schema: { $ref: '#/components/schemas/UUIDv7' } }
    JobID: { name: id, in: path, required: true, schema: { $ref: '#/components/schemas/UUIDv7' } }
    SimulationRunID: { name: id, in: path, required: true, schema: { $ref: '#/components/schemas/UUIDv7' } }
    RiskReviewID: { name: id, in: path, required: true, schema: { $ref: '#/components/schemas/UUIDv7' } }
    IdempotencyKey: { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 1, maxLength: 256 }, description: Reuse with byte-equivalent canonical input returns the original Job; changed input returns idempotency conflict. }
    GraphRetryIdempotencyKey: { name: Idempotency-Key, in: header, required: false, schema: { type: string, minLength: 1, maxLength: 256 }, description: Required when graph-sync intent is retry; reuse returns the original retry Job and changed retry input conflicts. It is ignored for ensure. }
    LastEventID: { name: Last-Event-ID, in: header, schema: { type: integer, minimum: 0 }, description: Resume SSE delivery strictly after this persisted event ordinal. }
    IfMatch: { name: If-Match, in: header, required: true, schema: { type: string }, description: Strong ETag returned by GET/create/patch. }
  headers:
    EntityETag: { required: true, schema: { type: string }, description: Strong ETag for the returned entity version. }
  responses:
    Problem: { description: RFC 9457 problem, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  schemas:
    UUIDv7: { type: string, format: uuid, description: Server allocated UUIDv7. }
    DecimalString: { type: string, pattern: '^-?(0|[1-9][0-9]*)(\.[0-9]+)?$', description: Canonical finite decimal128 string. }
    IntegerString: { type: string, pattern: '^-?(0|[1-9][0-9]*)$', description: Canonical integer string. }
    Hash: { type: string, pattern: '^[a-f0-9]{64}$' }
    EntityKind: { type: string, enum: [character, skill, item, effect, tag, attribute] }
    ProjectSelection:
      type: object
      required: [token, expires_at]
      properties:
        token: { type: string, minLength: 1, description: Opaque short-lived process-local capability. }
        expires_at: { type: string, format: date-time }
    OpenProjectRequest:
      type: object
      required: [selection_token, mode]
      properties:
        selection_token: { type: string }
        mode: { type: string, enum: [create, open] }
    Project:
      type: object
      required: [id, name, db_schema_version]
      properties:
        id: { $ref: '#/components/schemas/UUIDv7' }
        name: { type: string }
        db_schema_version: { type: integer, minimum: 1 }
    EntitySchema:
      type: object
      required: [kind, schema_id, schema, dsl_registry]
      properties:
        kind: { $ref: '#/components/schemas/EntityKind' }
        schema_id: { type: string, pattern: '^urn:eco:schema:' }
        schema: { type: object, additionalProperties: true }
        ui_hints: { type: object, additionalProperties: true }
        dsl_registry: { $ref: '#/components/schemas/DslRegistryMetadata' }
    DslRegistryMetadata:
      type: object
      required: [dsl_version, manifest_hash, selector_template, scopes, units, functions]
      description: Read-only metadata for suggestions. It contains no executable code.
      properties:
        dsl_version: { type: string }
        manifest_hash: { $ref: '#/components/schemas/Hash' }
        selector_template: { type: string, const: '${scope:symbol}' }
        scopes: { type: array, items: { type: string, enum: [self, source, target, scenario] } }
        units: { type: array, items: { $ref: '#/components/schemas/DslUnitMetadata' } }
        functions: { type: array, items: { $ref: '#/components/schemas/DslFunctionMetadata' } }
    DslUnitMetadata:
      type: object
      required: [name, value_type, dimension, base]
      properties:
        name: { type: string }
        value_type: { type: string, enum: [decimal, integer] }
        dimension: { type: string }
        base: { type: string }
    DslFunctionMetadata:
      type: object
      required: [name, signature, pure, implementation_version]
      properties:
        name: { type: string }
        signature: { type: string }
        pure: { type: boolean, const: true }
        implementation_version: { type: string }
    EntityStatus: { type: string, enum: [active, archived] }
    Entity:
      type: object
      required: [id, kind, key, name, tag_ids, status, schema_version, payload, extensions, entity_version, created_at, updated_at]
      properties:
        id: { $ref: '#/components/schemas/UUIDv7' }
        kind: { $ref: '#/components/schemas/EntityKind' }
        key: { type: string, minLength: 1, maxLength: 128, pattern: '^[a-z][a-z0-9_]*$' }
        name: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, maxLength: 10000 }
        tag_ids: { type: array, items: { $ref: '#/components/schemas/UUIDv7' } }
        balance_group: { type: string, maxLength: 128 }
        status: { $ref: '#/components/schemas/EntityStatus' }
        schema_version: { type: integer, const: 1 }
        payload: { $ref: '#/components/schemas/EntityPayload' }
        extensions: { type: object, additionalProperties: true, description: Namespaced opaque extension values. }
        entity_version: { type: integer, minimum: 1 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    EntityDraft:
      type: object
      required: [key, name, payload]
      properties:
        key: { type: string, minLength: 1, maxLength: 128, pattern: '^[a-z][a-z0-9_]*$' }
        name: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, maxLength: 10000 }
        tag_ids: { type: array, items: { $ref: '#/components/schemas/UUIDv7' }, default: [] }
        balance_group: { type: string, maxLength: 128 }
        payload: { $ref: '#/components/schemas/EntityPayload' }
        extensions: { type: object, additionalProperties: true, default: {} }
    EntityPatch:
      type: object
      additionalProperties: false
      properties:
        key: { type: string, minLength: 1, maxLength: 128, pattern: '^[a-z][a-z0-9_]*$' }
        name: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, maxLength: 10000 }
        tag_ids: { type: array, items: { $ref: '#/components/schemas/UUIDv7' } }
        balance_group: { type: string, maxLength: 128 }
        payload: { $ref: '#/components/schemas/EntityPayload' }
        extensions: { type: object, additionalProperties: true }
    EntityPayload:
      oneOf:
        - { $ref: '#/components/schemas/AttributePayload' }
        - { $ref: '#/components/schemas/TagPayload' }
        - { $ref: '#/components/schemas/CharacterPayload' }
        - { $ref: '#/components/schemas/SkillPayload' }
        - { $ref: '#/components/schemas/ItemPayload' }
        - { $ref: '#/components/schemas/EffectPayload' }
    AttributePayload:
      type: object
      required: [value_type, dimension, base_unit, default]
      properties:
        value_type: { type: string, enum: [integer, decimal, boolean] }
        dimension: { type: string }
        base_unit: { type: string }
        default: { oneOf: [{ $ref: '#/components/schemas/DecimalString' }, { type: boolean }] }
        min: { $ref: '#/components/schemas/DecimalString' }
        max: { $ref: '#/components/schemas/DecimalString' }
        display_scale: { $ref: '#/components/schemas/DecimalString' }
    TagPayload:
      type: object
      required: [category, parent_tag_ids]
      properties:
        category: { type: string }
        parent_tag_ids: { type: array, items: { $ref: '#/components/schemas/UUIDv7' } }
    FormulaBinding:
      type: object
      required: [output_attribute_id, expression]
      properties:
        output_attribute_id: { $ref: '#/components/schemas/UUIDv7' }
        expression: { type: string, minLength: 1 }
    TargetSelector:
      type: object
      required: [type]
      properties:
        type: { type: string, enum: [self, source, primary_target, all_targets, targets_with_tag] }
        tag_id: { $ref: '#/components/schemas/UUIDv7' }
    TriggerRule:
      type: object
      required: [event, target]
      properties:
        event: { type: string, enum: [on_use, on_hit, on_damage, on_heal, on_interval, on_effect_applied] }
        condition: { type: string }
        target: { $ref: '#/components/schemas/TargetSelector' }
        effect_ids: { type: array, items: { $ref: '#/components/schemas/UUIDv7' } }
        termination_budget: { $ref: '#/components/schemas/IntegerString' }
    Modifier:
      type: object
      required: [attribute_id, operation, value]
      properties:
        attribute_id: { $ref: '#/components/schemas/UUIDv7' }
        operation: { type: string, enum: [Add, Multiply, Override, Max, Min] }
        value: { $ref: '#/components/schemas/DecimalString' }
    StackRule:
      type: object
      required: [operation, max_stacks, refresh_policy]
      properties:
        operation: { type: string, enum: [Add, Multiply, Override, Max, Min] }
        priority: { $ref: '#/components/schemas/IntegerString' }
        max_stacks: { $ref: '#/components/schemas/IntegerString' }
        refresh_policy: { type: string, enum: [refresh, replace, ignore] }
        cap: { $ref: '#/components/schemas/DecimalString' }
    CharacterPayload:
      type: object
      required: [attribute_values, skill_ids, item_ids, rule_blocks]
      properties:
        attribute_values: { type: array, items: { $ref: '#/components/schemas/FormulaBinding' } }
        skill_ids: { type: array, items: { $ref: '#/components/schemas/UUIDv7' } }
        item_ids: { type: array, items: { $ref: '#/components/schemas/UUIDv7' } }
        rule_blocks: { type: array, items: { $ref: '#/components/schemas/TriggerRule' } }
    SkillPayload:
      type: object
      required: [costs, cooldown, target_selector, effect_ids, rule_blocks]
      properties:
