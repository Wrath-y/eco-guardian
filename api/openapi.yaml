        confidence_low: { oneOf: [{ $ref: '#/components/schemas/DecimalString' }, { type: 'null' }] }
        confidence_high: { oneOf: [{ $ref: '#/components/schemas/DecimalString' }, { type: 'null' }] }
        unavailable: { oneOf: [{ $ref: '#/components/schemas/RiskMetricUnavailableReason' }, { type: 'null' }] }
        run_id: { $ref: '#/components/schemas/UUIDv7' }
        result_hash: { $ref: '#/components/schemas/Hash' }
    RiskMetricEvidence:
      type: object
      additionalProperties: false
      required: [scene_id, scene_version, metric_id, metric_version, unit, direction, target_range, absolute_threshold, subject, candidate, baseline, signed_delta, risk_delta, relative_risk, assumptions]
      properties:
        scene_id: { type: string, minLength: 1 }
        scene_version: { type: string, minLength: 1 }
        metric_id: { type: string, minLength: 1 }
        metric_version: { type: string, minLength: 1 }
        unit: { type: string, minLength: 1 }
        direction: { type: string, enum: [higher_is_risk, lower_is_risk, target_range] }
        target_range:
          oneOf:
            - type: object
              additionalProperties: false
              required: [lower, upper, bounds]
              properties:
                lower: { $ref: '#/components/schemas/DecimalString' }
                upper: { $ref: '#/components/schemas/DecimalString' }
                bounds: { type: string, const: inclusive }
            - type: 'null'
