openapi: 3.1.0
info:
  title: Eco Guardian local API
  version: 1.0.0
  description: Loopback-only contract for local configuration authoring.
servers:
  - url: /api/v1
paths:
  /project-selections:
    post:
      operationId: selectProjectDirectory
      responses:
        '201': { description: Directory selected, content: { application/json: { schema: { $ref: '#/components/schemas/ProjectSelection' } } } }
        default: { $ref: '#/components/responses/Problem' }
  /projects:
    post:
      operationId: openProject
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/OpenProjectRequest' } } } }
      responses:
        '200': { description: Project is active, content: { application/json: { schema: { $ref: '#/components/schemas/Project' } } } }
        '201': { description: Project created and active, content: { application/json: { schema: { $ref: '#/components/schemas/Project' } } } }
        default: { $ref: '#/components/responses/Problem' }
  /projects/current:
    get:
      operationId: getCurrentProject
      responses:
        '200': { description: Active project, content: { application/json: { schema: { $ref: '#/components/schemas/Project' } } } }
        '404': { $ref: '#/components/responses/Problem' }
  /projects/recent:
    get:
      operationId: listRecentProjects
      responses:
        '200': { description: Recent project metadata, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Project' } } } } }
        default: { $ref: '#/components/responses/Problem' }
  /projects/recent/{id}:
    post:
      operationId: openRecentProject
      parameters: [ { $ref: '#/components/parameters/ProjectID' } ]
      responses:
        '200': { description: Recent project opened and active, content: { application/json: { schema: { $ref: '#/components/schemas/Project' } } } }
        default: { $ref: '#/components/responses/Problem' }
  /projects/recent/{id}/close-other-instance:
    post:
      operationId: closeOtherProjectInstance
      description: Requests the cryptographically identified loopback instance holding this recent project's exclusive lock to close, then waits for lock release. No PID, path, listener URL, or peer credential is exposed to the browser.
      parameters: [ { $ref: '#/components/parameters/ProjectID' } ]
      responses:
        '204': { description: Other instance closed and the project lock was released }
        default: { $ref: '#/components/responses/Problem' }
  /projects/close:
    post:
      operationId: closeProject
      responses:
        '204': { description: Project closed }
        default: { $ref: '#/components/responses/Problem' }
  /schemas/entities/{kind}:
    get:
      operationId: getEntitySchema
      parameters: [ { $ref: '#/components/parameters/Kind' } ]
      responses:
        '200': { description: Compiled registry schema, content: { application/json: { schema: { $ref: '#/components/schemas/EntitySchema' } } } }
        default: { $ref: '#/components/responses/Problem' }
  /formula-validations:
    post:
      operationId: validateFormula
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/FormulaValidationRequest' } } } }
      responses:
        '200': { description: Formula syntax, type and unit diagnostics, content: { application/json: { schema: { $ref: '#/components/schemas/FormulaValidationResult' } } } }
        default: { $ref: '#/components/responses/Problem' }
  /entities/{kind}:
    get:
      operationId: listEntities
      parameters:
        - { $ref: '#/components/parameters/Kind' }
        - { name: query, in: query, schema: { type: string, maxLength: 256 } }
        - { name: cursor, in: query, description: Opaque continuation cursor, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, default: 50, minimum: 1, maximum: 200 } }
      responses:
        '200': { description: Stable entity page, content: { application/json: { schema: { $ref: '#/components/schemas/EntityPage' } } } }
        default: { $ref: '#/components/responses/Problem' }
    post:
      operationId: createEntity
      parameters: [ { $ref: '#/components/parameters/Kind' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/EntityDraft' } } } }
      responses:
        '201':
          description: Entity created in a new revision
          headers: { ETag: { $ref: '#/components/headers/EntityETag' } }
          content: { application/json: { schema: { $ref: '#/components/schemas/SaveEntityResponse' } } }
        default: { $ref: '#/components/responses/Problem' }
  /entities/{kind}/{id}:
    get:
      operationId: getEntity
      parameters: [ { $ref: '#/components/parameters/Kind' }, { $ref: '#/components/parameters/EntityID' } ]
      responses:
        '200':
          description: Entity
          headers: { ETag: { $ref: '#/components/headers/EntityETag' } }
          content: { application/json: { schema: { $ref: '#/components/schemas/Entity' } } }
        default: { $ref: '#/components/responses/Problem' }
    patch:
      operationId: patchEntity
      parameters:
        - { $ref: '#/components/parameters/Kind' }
        - { $ref: '#/components/parameters/EntityID' }
        - { $ref: '#/components/parameters/IfMatch' }
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/EntityPatch' } } } }
      responses:
        '200':
          description: Entity updated in a new revision
          headers: { ETag: { $ref: '#/components/headers/EntityETag' } }
          content: { application/json: { schema: { $ref: '#/components/schemas/SaveEntityResponse' } } }
        default: { $ref: '#/components/responses/Problem' }
    delete:
      operationId: deleteEntity
      parameters:
        - { $ref: '#/components/parameters/Kind' }
        - { $ref: '#/components/parameters/EntityID' }
        - { $ref: '#/components/parameters/IfMatch' }
      responses:
        '200': { description: Entity archived in a new revision, content: { application/json: { schema: { $ref: '#/components/schemas/SaveEntityResponse' } } } }
        default: { $ref: '#/components/responses/Problem' }
  /validation/runs:
    post:
      operationId: createValidationRun
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateValidationRunRequest' } } } }
      responses:
        '201': { description: Synchronously completed immutable validation run, content: { application/json: { schema: { $ref: '#/components/schemas/ValidationRun' } } } }
        default: { $ref: '#/components/responses/Problem' }
  /validation/runs/{id}:
    get:
      operationId: getValidationRun
      parameters: [ { $ref: '#/components/parameters/ValidationRunID' } ]
      responses:
        '200': { description: Immutable validation result, content: { application/json: { schema: { $ref: '#/components/schemas/ValidationRun' } } } }
        default: { $ref: '#/components/responses/Problem' }
  /revisions:
    get:
      operationId: listRevisions
      parameters:
        - { name: cursor, in: query, schema: { type: string }, description: Opaque stable continuation cursor. }
        - { name: limit, in: query, schema: { type: integer, default: 50, minimum: 1, maximum: 200 } }
      responses:
        '200': { description: Stable revision history page, content: { application/json: { schema: { $ref: '#/components/schemas/RevisionPage' } } } }
        default: { $ref: '#/components/responses/Problem' }
    post:
      operationId: createRevision
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateRevisionRequest' } } } }
      responses:
        '201': { description: Immutable checkpoint or forward-rollback revision created, content: { application/json: { schema: { $ref: '#/components/schemas/RevisionDetail' } } } }
        default: { $ref: '#/components/responses/Problem' }
  /revisions/{id}:
    get:
      operationId: getRevision
      parameters: [ { $ref: '#/components/parameters/RevisionID' } ]
      responses:
        '200': { description: Immutable revision detail and derived status timeline, content: { application/json: { schema: { $ref: '#/components/schemas/RevisionDetail' } } } }
        default: { $ref: '#/components/responses/Problem' }
  /revisions/{id}/diff:
    get:
      operationId: getRevisionDiff
      parameters:
        - { $ref: '#/components/parameters/RevisionID' }
        - { name: base, in: query, required: true, schema: { $ref: '#/components/schemas/UUIDv7' }, description: Immutable base revision; no server-side fallback is permitted. }
      responses:
        '200': { description: Deterministic structured revision diff, content: { application/json: { schema: { $ref: '#/components/schemas/RevisionDiff' } } } }
        default: { $ref: '#/components/responses/Problem' }
  /revisions/{id}/graph-sync:
    post:
      operationId: ensureGraphSync
      description: Ensures the exact immutable revision has one admitted Graph sync Job. A retry request requires a stable Idempotency-Key and never changes the revision or snapshot identity.
      parameters:
        - { $ref: '#/components/parameters/RevisionID' }
        - { $ref: '#/components/parameters/GraphRetryIdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GraphSyncRequest' }
      responses:
        '202':
          description: Existing or newly admitted durable Graph Job. The Location header and job URLs identify the same Job.
          headers:
            Location: { required: true, schema: { type: string, format: uri-reference } }
          content:
            application/json: { schema: { $ref: '#/components/schemas/GraphSyncJobAccepted' } }
        default: { $ref: '#/components/responses/Problem' }
  /revisions/{id}/graph-status:
    get:
      operationId: getGraphStatus
      description: Reads only the exact revision's persisted Graph observations. It never starts sync, rebuilds a projection, mutates a provider Snapshot, or falls back to another revision.
      parameters: [ { $ref: '#/components/parameters/RevisionID' } ]
      responses:
        '200': { description: Exact revision Graph state and last safe provider observation, content: { application/json: { schema: { $ref: '#/components/schemas/GraphStatus' } } } }
        default: { $ref: '#/components/responses/Problem' }
  /impact-analyses:
    post:
      operationId: createImpactAnalysis
      description: Admits one immutable revision-pair impact analysis. All revision, validation and Graph identity preconditions are synchronous and no Job is created when they fail.
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateImpactAnalysisRequest' } } } }
      responses:
        '202':
          description: Existing or newly admitted durable impact Job.
          headers: { Location: { required: true, schema: { type: string, format: uri-reference } } }
          content: { application/json: { schema: { $ref: '#/components/schemas/ImpactJobAccepted' } } }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }
  /impact-analyses/{id}:
    get:
      operationId: getImpactAnalysis
      description: Reads one immutable historical impact report and derives freshness without mutating it.
      parameters: [ { $ref: '#/components/parameters/ImpactAnalysisID' } ]
      responses:
        '200': { description: Immutable impact report., content: { application/json: { schema: { $ref: '#/components/schemas/ImpactAnalysisReport' } } } }
        '404': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }
  /impact-analyses/{id}/path-expansions:
    post:
      operationId: expandImpactPaths
      parameters: [ { $ref: '#/components/parameters/ImpactAnalysisID' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ImpactPathExpansionRequest' } } } }
      responses:
        '200': { description: Existing or newly appended insert-only path expansion., content: { application/json: { schema: { $ref: '#/components/schemas/ImpactPathExpansion' } } } }
        default: { $ref: '#/components/responses/Problem' }
  /impact-analyses/{id}/explanations:
    post:
      operationId: explainImpactEvidence
      parameters: [ { $ref: '#/components/parameters/ImpactAnalysisID' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ImpactExplanationRequest' } } } }
      responses:
        '202': { description: Bounded optional AI explanation attempt., content: { application/json: { schema: { $ref: '#/components/schemas/ImpactExplanation' } } } }
        default: { $ref: '#/components/responses/Problem' }
  /release-policies:
    get:
      operationId: listReleasePolicies
      parameters:
        - { name: cursor, in: query, schema: { type: string }, description: Opaque stable continuation cursor. }
        - { name: limit, in: query, schema: { type: integer, default: 50, minimum: 1, maximum: 200 } }
      responses:
        '200': { description: Immutable release-policy history, content: { application/json: { schema: { $ref: '#/components/schemas/ReleasePolicyPage' } } } }
        default: { $ref: '#/components/responses/Problem' }
    post:
      operationId: createReleasePolicy
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateReleasePolicyRequest' } } } }
      responses:
        '201': { description: New immutable release-policy version, content: { application/json: { schema: { $ref: '#/components/schemas/ReleasePolicy' } } } }
        default: { $ref: '#/components/responses/Problem' }
  /releases:
    get:
      operationId: listReleases
      parameters:
        - { name: cursor, in: query, schema: { type: string }, description: Opaque stable continuation cursor. }
        - { name: limit, in: query, schema: { type: integer, default: 50, minimum: 1, maximum: 200 } }
      responses:
        '200': { description: Read-only release history, content: { application/json: { schema: { $ref: '#/components/schemas/ReleasePage' } } } }
        default: { $ref: '#/components/responses/Problem' }
    post:
      operationId: createRelease
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateReleaseRequest' } } } }
      responses:
        '202': { description: Release preflight accepted and durable Job queued, content: { application/json: { schema: { $ref: '#/components/schemas/ReleaseJobAccepted' } } } }
        default: { $ref: '#/components/responses/Problem' }
  /releases/{id}:
    get:
      operationId: getRelease
      parameters: [ { $ref: '#/components/parameters/ReleaseID' } ]
      responses:
        '200': { description: Immutable release detail, content: { application/json: { schema: { $ref: '#/components/schemas/ReleaseDetail' } } } }
        default: { $ref: '#/components/responses/Problem' }
  /jobs/{id}:
    get:
      operationId: getJob
      parameters: [ { $ref: '#/components/parameters/JobID' } ]
      responses:
        '200': { description: Durable registered Job state; clients may poll using poll_after_ms, content: { application/json: { schema: { $ref: '#/components/schemas/Job' } } } }
        default: { $ref: '#/components/responses/Problem' }
  /jobs/{id}/events:
    get:
      operationId: streamJobEvents
      parameters:
        - { $ref: '#/components/parameters/JobID' }
        - { $ref: '#/components/parameters/LastEventID' }
      responses:
        '200': { description: Persisted Job events in ordinal order, content: { text/event-stream: { schema: { type: string } } } }
        default: { $ref: '#/components/responses/Problem' }
  /jobs/{id}/cancel:
    post:
      operationId: cancelJob
      parameters: [ { $ref: '#/components/parameters/JobID' } ]
      responses:
        '202': { description: Cancellation intent persisted for a registered Job; feature workers resolve it at their documented safe boundary, content: { application/json: { schema: { $ref: '#/components/schemas/Job' } } } }
        default: { $ref: '#/components/responses/Problem' }
  /backups:
    get:
      operationId: listBackups
      description: Lists filesystem-discovered backup artifacts for the active project in stable newest-first order. This operation is side-effect free.
      parameters:
        - { name: cursor, in: query, schema: { type: string }, description: Opaque stable continuation cursor. }
        - { name: limit, in: query, schema: { type: integer, default: 50, minimum: 1, maximum: 200 } }
      responses:
        '200': { description: Stable backup inventory page., content: { application/json: { schema: { $ref: '#/components/schemas/BackupPage' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }
    post:
      operationId: createBackup
      description: Admits one manual project backup. Clients cannot supply a source or destination path.
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateBackupRequest' } } } }
      responses:
        '202':
          description: Existing or newly admitted durable backup Job.
          headers: { Location: { required: true, schema: { type: string, format: uri-reference } } }
          content: { application/json: { schema: { $ref: '#/components/schemas/BackupJobAccepted' } } }
        '400': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }
  /backups/daily-waivers:
    post:
      operationId: confirmDailyBackupWaiver
      description: Records an explicit same-day decision to continue ordinary editing after the bound daily backup Job failed. It never satisfies mandatory backup gates.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/DailyBackupWaiverRequest' } } }
      responses:
        '200': { description: Durable same-day waiver audit., content: { application/json: { schema: { $ref: '#/components/schemas/DailyBackupWaiver' } } } }
        default: { $ref: '#/components/responses/Problem' }
  /backups/daily-retries:
    post:
      operationId: retryDailyBackup
      description: Replaces the bound failed same-day daily backup attempt and synchronously retries protection before the retained business mutation is resubmitted.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/DailyBackupRetryRequest' } } }
      responses:
        '200': { description: Succeeded replacement daily backup Job., content: { application/json: { schema: { $ref: '#/components/schemas/Job' } } } }
        default: { $ref: '#/components/responses/Problem' }
  /backups/{backup_id}:
    get:
      operationId: getBackup
      parameters: [ { $ref: '#/components/parameters/BackupID' } ]
      responses:
        '200': { description: Immutable backup result and validation projection., content: { application/json: { schema: { $ref: '#/components/schemas/BackupRecord' } } } }
        '404': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }
  /restore-preflights:
    post:
      operationId: createRestorePreflight
      description: Revalidates one inventory backup and server-owned target before any maintenance or mutation. The returned generation is bound to the final restore command.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateRestorePreflightRequest' } } } }
      responses:
        '200': { description: Server-authoritative restore confirmation summary., content: { application/json: { schema: { $ref: '#/components/schemas/RestorePreflight' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }
  /restores:
    post:
      operationId: createRestore
      description: Admits the confirmed restore for exactly one fresh preflight. No arbitrary source or target path is accepted.
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateRestoreRequest' } } } }
      responses:
        '202':
          description: Existing or newly admitted durable restore Job.
          headers: { Location: { required: true, schema: { type: string, format: uri-reference } } }
          content: { application/json: { schema: { $ref: '#/components/schemas/RestoreJobAccepted' } } }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }
  /simulation-jobs:
    post:
      operationId: createSimulationJob
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateSimulationJobRequest' } } } }
      responses:
        '202':
          description: Existing or newly admitted durable simulation Job.
          headers: { Location: { required: true, schema: { type: string, format: uri-reference } } }
          content: { application/json: { schema: { $ref: '#/components/schemas/SimulationJobAccepted' } } }
        default: { $ref: '#/components/responses/Problem' }
  /simulation-runs/{id}:
    get:
      operationId: getSimulationRun
      parameters: [ { $ref: '#/components/parameters/SimulationRunID' } ]
      responses:
        '200': { description: Immutable simulation result with read-time reproducibility projection., content: { application/json: { schema: { $ref: '#/components/schemas/SimulationRun' } } } }
        default: { $ref: '#/components/responses/Problem' }
  /risk-reviews:
    post:
      operationId: createRiskReview
      description: Admits either a deterministic evaluation or a new immutable numeric decision report. Severity, Gate state and override outcomes are always server-derived.
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/RiskReviewCommand' } } }
      responses:
        '202':
          description: Existing or newly admitted durable risk Job.
          headers: { Location: { required: true, schema: { type: string, format: uri-reference } } }
          content: { application/json: { schema: { $ref: '#/components/schemas/RiskJobAccepted' } } }
        default: { $ref: '#/components/responses/Problem' }
  /risk-reviews/{id}:
    get:
      operationId: getRiskReview
      description: Reads one immutable calculation or decision report plus read-time freshness, Gate and release-audit links. Read-time projections never alter stored calculation hashes.
      parameters: [ { $ref: '#/components/parameters/RiskReviewID' } ]
      responses:
        '200': { description: Immutable risk review detail., content: { application/json: { schema: { $ref: '#/components/schemas/RiskReview' } } } }
        default: { $ref: '#/components/responses/Problem' }
  /ai-design-jobs:
    post:
      operationId: createAIDesignJob
      description: Admits a bounded AI proposal Job over one explicit immutable base revision. The Job can produce only a reviewable DraftPatch and never writes a revision or release.
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateAIDesignJobRequest' } } }
      responses:
        '202':
          description: Existing or newly admitted durable AI design Job.
          headers: { Location: { required: true, schema: { type: string, format: uri-reference } } }
          content: { application/json: { schema: { $ref: '#/components/schemas/AIDesignJobAccepted' } } }
        default: { $ref: '#/components/responses/Problem' }
  /draft-patches/{id}:
    get:
      operationId: getDraftPatch
      description: Reads an immutable generated Patch, evidence, attempt lineage and advisory preview plus read-time freshness and decision projections.
      parameters: [ { $ref: '#/components/parameters/DraftPatchID' } ]
      responses:
        '200': { description: DraftPatch review resource., content: { application/json: { schema: { $ref: '#/components/schemas/DraftPatchResource' } } } }
        default: { $ref: '#/components/responses/Problem' }
  /draft-patches/{id}/accept:
    post:
      operationId: acceptDraftPatch
      description: Records an explicit human acceptance and atomically creates one revision after server-side freshness and policy revalidation. It never publishes a release.
      parameters: [ { $ref: '#/components/parameters/DraftPatchID' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/AcceptDraftPatchRequest' } } }
      responses:
        '200': { description: Existing or newly committed acceptance result., content: { application/json: { schema: { $ref: '#/components/schemas/AcceptDraftPatchResult' } } } }
        default: { $ref: '#/components/responses/Problem' }
  /draft-patches/{id}/discard:
    post:
      operationId: discardDraftPatch
      description: Records an append-only human discard decision without changing the working draft.
      parameters: [ { $ref: '#/components/parameters/DraftPatchID' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/DiscardDraftPatchRequest' } } }
      responses:
        '200': { description: Existing or newly recorded discard result., content: { application/json: { schema: { $ref: '#/components/schemas/DiscardDraftPatchResult' } } } }
        default: { $ref: '#/components/responses/Problem' }
  /settings:
    get:
      operationId: getSettings
      description: Reads non-sensitive machine-local settings and Provider readiness metadata. Credential material is never returned.
      responses:
        '200': { description: Non-sensitive runtime settings., content: { application/json: { schema: { $ref: '#/components/schemas/SettingsResource' } } } }
        default: { $ref: '#/components/responses/Problem' }
    patch:
      operationId: patchSettings
      description: Atomically updates bounded non-sensitive machine settings and reports fields applied now or requiring an explicit reconnect/restart. Credential material is rejected and uses the separate write-only endpoint.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PatchSettingsRequest' } } }
      responses:
        '200': { description: Updated settings and their deterministic application effects., content: { application/json: { schema: { $ref: '#/components/schemas/SettingsUpdateResult' } } } }
        default: { $ref: '#/components/responses/Problem' }
  /settings/backup-root-selection:
    post:
      operationId: selectBackupRoot
      description: Opens the native directory selector and atomically applies its one-use server-side selection token. No local path is returned to or accepted from the browser.
      responses:
        '200': { description: Updated non-sensitive settings after the selected root is validated and applied., content: { application/json: { schema: { $ref: '#/components/schemas/SettingsUpdateResult' } } } }
        default: { $ref: '#/components/responses/Problem' }
  /settings/credentials/{provider}:
    put:
      operationId: putProviderCredential
      description: Writes a Provider credential to the platform credential manager. The credential is write-only and is never returned or persisted in settings.
      parameters: [ { $ref: '#/components/parameters/AIProviderName' } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PutProviderCredentialRequest' } } }
      responses:
        '200': { description: Safe credential presence and source metadata., content: { application/json: { schema: { $ref: '#/components/schemas/ProviderCredentialStatus' } } } }
        default: { $ref: '#/components/responses/Problem' }
    delete:
      operationId: deleteProviderCredential
      description: Deletes the persistent Provider credential. A process environment credential may remain available as a non-persistent, lower-precedence fallback.
      parameters: [ { $ref: '#/components/parameters/AIProviderName' } ]
      responses:
        '200': { description: Safe credential presence and source metadata after deletion., content: { application/json: { schema: { $ref: '#/components/schemas/ProviderCredentialStatus' } } } }
        default: { $ref: '#/components/responses/Problem' }
  /runtime/status:
    get:
      operationId: getRuntimeStatus
      description: Reads one immutable, side-effect-free runtime snapshot without handles, secrets, raw paths, Provider payloads, child output, or business content.
      responses:
        '200': { description: Versioned safe runtime status., content: { application/json: { schema: { $ref: '#/components/schemas/RuntimeStatusResource' } } } }
        default: { $ref: '#/components/responses/Problem' }
  /runtime/reprobe:
    post:
      operationId: reprobeRuntimeDependencies
      description: Invalidates the selected Graph health observation and performs one bounded, side-effect-free compatibility probe. It never starts a process or creates business work.
      parameters: [ { $ref: '#/components/parameters/RuntimeActionIdempotencyKey' } ]
      responses:
        '204': { description: Dependency health was re-probed and runtime capabilities were refreshed. }
        default: { $ref: '#/components/responses/Problem' }
  /runtime/reconnect:
    post:
      operationId: reconnectRuntimeGraph
      description: Re-applies the validated Graph selection, stopping only a child owned by this Eco Guardian instance. External services are never terminated.
      parameters: [ { $ref: '#/components/parameters/RuntimeActionIdempotencyKey' } ]
      responses:
        '204': { description: Graph selection was reconnected and runtime capabilities were refreshed. }
        default: { $ref: '#/components/responses/Problem' }
  /runtime/capabilities:
    get:
      operationId: getRuntimeCapabilities
      responses:
        '200': { description: Server-authoritative release capability state, content: { application/json: { schema: { $ref: '#/components/schemas/RuntimeCapabilities' } } } }
        default: { $ref: '#/components/responses/Problem' }
components:
  parameters:
    Kind: { name: kind, in: path, required: true, schema: { $ref: '#/components/schemas/EntityKind' } }
    EntityID: { name: id, in: path, required: true, schema: { $ref: '#/components/schemas/UUIDv7' } }
    ProjectID: { name: id, in: path, required: true, schema: { $ref: '#/components/schemas/UUIDv7' } }
    ValidationRunID: { name: id, in: path, required: true, schema: { $ref: '#/components/schemas/UUIDv7' } }
    RevisionID: { name: id, in: path, required: true, schema: { $ref: '#/components/schemas/UUIDv7' } }
    ReleaseID: { name: id, in: path, required: true, schema: { $ref: '#/components/schemas/UUIDv7' } }
    JobID: { name: id, in: path, required: true, schema: { $ref: '#/components/schemas/UUIDv7' } }
    SimulationRunID: { name: id, in: path, required: true, schema: { $ref: '#/components/schemas/UUIDv7' } }
    RiskReviewID: { name: id, in: path, required: true, schema: { $ref: '#/components/schemas/UUIDv7' } }
    DraftPatchID: { name: id, in: path, required: true, schema: { $ref: '#/components/schemas/UUIDv7' } }
    ImpactAnalysisID: { name: id, in: path, required: true, schema: { $ref: '#/components/schemas/UUIDv7' } }
    AIProviderName: { name: provider, in: path, required: true, schema: { type: string, enum: [openai-compatible] } }
    BackupID: { name: backup_id, in: path, required: true, schema: { $ref: '#/components/schemas/UUIDv7' }, description: Opaque server-issued backup identity; never a filename or path. }
    IdempotencyKey: { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 1, maxLength: 256 }, description: Reuse with byte-equivalent canonical input returns the original Job; changed input returns idempotency conflict. }
    GraphRetryIdempotencyKey: { name: Idempotency-Key, in: header, required: false, schema: { type: string, minLength: 1, maxLength: 256 }, description: Required when graph-sync intent is retry; reuse returns the original retry Job and changed retry input conflicts. It is ignored for ensure. }
    RuntimeActionIdempotencyKey: { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 1, maxLength: 128, pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$' }, description: Reuse for the same runtime action returns the original bounded action outcome without executing it again. }
    LastEventID: { name: Last-Event-ID, in: header, schema: { type: integer, minimum: 0 }, description: Resume SSE delivery strictly after this persisted event ordinal. }
    IfMatch: { name: If-Match, in: header, required: true, schema: { type: string }, description: Strong ETag returned by GET/create/patch. }
  headers:
    EntityETag: { required: true, schema: { type: string }, description: Strong ETag for the returned entity version. }
  responses:
    Problem: { description: RFC 9457 problem, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  schemas:
    UUIDv7: { type: string, format: uuid, description: Server allocated UUIDv7. }
    DecimalString: { type: string, pattern: '^-?(0|[1-9][0-9]*)(\.[0-9]+)?$', description: Canonical finite decimal128 string. }
    IntegerString: { type: string, pattern: '^-?(0|[1-9][0-9]*)$', description: Canonical integer string. }
    Hash: { type: string, pattern: '^[a-f0-9]{64}$' }
    EntityKind: { type: string, enum: [character, skill, item, effect, tag, attribute] }
    ImpactDirection: { type: string, enum: [incoming, outgoing, both], default: incoming }
    ImpactTruncationReason: { type: string, enum: [MAX_DEPTH, MAX_NODES, MAX_PATHS] }
    ImpactSuspectedState: { type: string, enum: [disabled, ready, degraded, rebuild_required, unavailable, canceled] }
    ImpactFilters:
      type: object
      properties:
        relationship_kinds: { type: array, default: [explicit], minItems: 1, maxItems: 1, prefixItems: [ { const: explicit } ] }
        node_types: { type: array, uniqueItems: true, items: { $ref: '#/components/schemas/EntityKind' } }
        edge_types: { type: array, uniqueItems: true, items: { type: string, enum: [character_has_skill, character_uses_item, skill_applies_effect, item_applies_effect, formula_reads_attribute, effect_modifies_attribute, entity_has_tag, item_enhances_tag, effect_triggers_effect] } }
        direction: { $ref: '#/components/schemas/ImpactDirection' }
    ImpactLimits:
      type: object
      properties:
        max_depth: { type: integer, minimum: 1, maximum: 6, default: 3 }
        max_nodes: { type: integer, minimum: 1, maximum: 500, default: 500 }
        default_paths_per_target: { type: integer, const: 1, default: 1 }
        expanded_max_paths: { type: integer, minimum: 1, maximum: 100, default: 20 }
    ImpactSuspectedOptions:
      type: object
      properties:
        enabled: { type: boolean, default: false }
        max_seeds: { type: integer, minimum: 1, maximum: 100, default: 20 }
        max_results: { type: integer, minimum: 1, maximum: 100, default: 20 }
        graph_max_depth: { type: integer, minimum: 0, maximum: 3, default: 2 }
    CreateImpactAnalysisRequest:
      type: object
      additionalProperties: false
      required: [project_uuid, base_revision_id, target_revision_id]
      properties:
        project_uuid: { $ref: '#/components/schemas/UUIDv7' }
        base_revision_id: { $ref: '#/components/schemas/UUIDv7' }
        target_revision_id: { $ref: '#/components/schemas/UUIDv7' }
        filters: { $ref: '#/components/schemas/ImpactFilters' }
        limits: { $ref: '#/components/schemas/ImpactLimits' }
        suspected: { $ref: '#/components/schemas/ImpactSuspectedOptions' }
    ImpactJobAccepted:
      type: object
      required: [job, location, result_type, result_url]
      properties:
        job: { $ref: '#/components/schemas/Job' }
        location: { type: string, format: uri-reference }
        result_type: { type: string, const: impact_analysis }
        result_id: { oneOf: [ { $ref: '#/components/schemas/UUIDv7' }, { type: 'null' } ] }
        result_url: { type: string, format: uri-reference }
        cache_hit: { type: boolean, default: false }
    ImpactRevisionIdentity:
      type: object
      required: [revision_id, config_hash, version_manifest_hash, graph_manifest_hash, graph_node_count, graph_edge_count]
      properties:
        revision_id: { $ref: '#/components/schemas/UUIDv7' }
        config_hash: { $ref: '#/components/schemas/Hash' }
        version_manifest_hash: { $ref: '#/components/schemas/Hash' }
        graph_manifest_hash: { $ref: '#/components/schemas/Hash' }
        graph_node_count: { type: integer, minimum: 0 }
        graph_edge_count: { type: integer, minimum: 0 }
    ImpactChangedEntity:
      type: object
      required: [entity_id, kind, change_kind, field_paths, query_eligible]
      properties:
        entity_id: { $ref: '#/components/schemas/UUIDv7' }
        kind: { $ref: '#/components/schemas/EntityKind' }
        change_kind: { type: string, enum: [ADD, DELETE, MOVE, MODIFY] }
        field_paths: { type: array, items: { type: string } }
        target_node_id: { type: string }
        query_eligible: { type: boolean }
        ineligibility: { type: string, enum: [not_in_target_graph, filtered_node_type] }
    ImpactGraphNode:
      type: object
      required: [id, type, label, text, properties, provenance]
      properties:
        id: { type: string }
        type: { type: string }
        label: { type: string }
        text: { type: string }
        properties: { type: object, additionalProperties: true }
        provenance: { type: object, additionalProperties: true }
    ImpactGraphEdge:
      type: object
      required: [id, from, to, type, relation_kind, confidence, properties, provenance]
      properties:
        id: { type: string }
        from: { type: string }
        to: { type: string }
        type: { type: string }
        relation_kind: { type: string, enum: [explicit, inferred] }
        confidence: { type: number, minimum: 0, maximum: 1 }
        properties: { type: object, additionalProperties: true }
        provenance: { type: object, additionalProperties: true }
    ImpactPath:
      type: object
      required: [source_node_id, target_node_id, node_ids, edge_ids, nodes, edges, hop_count, truncated, truncation_reasons]
      properties:
        source_node_id: { type: string }
        target_node_id: { type: string }
        node_ids: { type: array, items: { type: string } }
        edge_ids: { type: array, items: { type: string } }
        nodes: { type: array, items: { $ref: '#/components/schemas/ImpactGraphNode' } }
        edges: { type: array, items: { $ref: '#/components/schemas/ImpactGraphEdge' } }
        hop_count: { type: integer, minimum: 0, maximum: 6 }
        truncated: { type: boolean }
        truncation_reasons: { type: array, items: { $ref: '#/components/schemas/ImpactTruncationReason' } }
    ImpactAffectedEntity:
      type: object
      required: [node, minimum_depth, direct, indirect, tag_rule, evidence_ref]
      properties:
        node: { $ref: '#/components/schemas/ImpactGraphNode' }
        minimum_depth: { type: integer, minimum: 1, maximum: 6 }
        direct: { type: boolean }
        indirect: { type: boolean }
        tag_rule: { type: boolean }
        evidence_ref: { $ref: '#/components/schemas/Hash' }
        default_path: { $ref: '#/components/schemas/ImpactPath' }
    ImpactSuspectedEvidence:
      type: object
      required: [rank, node, citation_text, seed_node_id, relationship_kinds, scores, algorithm_version, evidence_ref]
      properties:
        rank: { type: integer, minimum: 1 }
        node: { $ref: '#/components/schemas/ImpactGraphNode' }
        citation_text: { type: string }
        seed_node_id: { type: string }
        path: { $ref: '#/components/schemas/ImpactPath' }
        relationship_kinds: { type: array, items: { type: string, enum: [explicit, inferred] } }
        scores: { type: object, additionalProperties: true }
        fts_generation: { type: string }
        vector_generation: { type: string }
        algorithm_version: { type: string }
        evidence_ref: { $ref: '#/components/schemas/Hash' }
        model_provider: { type: string }
        model: { type: string }
    ImpactFreshness:
      type: object
      required: [fresh, reasons]
      properties:
        fresh: { type: boolean }
        reasons: { type: array, items: { type: string } }
    ImpactAnalysisReport:
      type: object
      required: [id, input_hash, result_hash, analysis_contract_version, project_uuid, base, target, filters, limits, suspected_options, mode, changed_entities, deterministic_affected, suspected_associations, suspected_state, truncated, truncation_reasons, warnings, cache_hit, freshness, created_at, links]
      properties:
        id: { $ref: '#/components/schemas/UUIDv7' }
        input_hash: { $ref: '#/components/schemas/Hash' }
        result_hash: { $ref: '#/components/schemas/Hash' }
        analysis_contract_version: { type: string, const: dependency-impact-v1 }
        project_uuid: { $ref: '#/components/schemas/UUIDv7' }
        base: { $ref: '#/components/schemas/ImpactRevisionIdentity' }
        target: { $ref: '#/components/schemas/ImpactRevisionIdentity' }
        filters: { $ref: '#/components/schemas/ImpactFilters' }
        limits: { $ref: '#/components/schemas/ImpactLimits' }
        suspected_options: { $ref: '#/components/schemas/ImpactSuspectedOptions' }
        mode: { type: string, enum: [reverse_dependency_impact, relationship_exploration] }
        changed_entities: { type: array, items: { $ref: '#/components/schemas/ImpactChangedEntity' } }
        deterministic_affected: { type: array, items: { $ref: '#/components/schemas/ImpactAffectedEntity' } }
        suspected_associations: { type: array, items: { $ref: '#/components/schemas/ImpactSuspectedEvidence' } }
        suspected_state: { $ref: '#/components/schemas/ImpactSuspectedState' }
        truncated: { type: boolean }
        truncation_reasons: { type: array, items: { $ref: '#/components/schemas/ImpactTruncationReason' } }
        warnings: { type: array, items: { type: string } }
        cache_hit: { type: boolean }
        freshness: { $ref: '#/components/schemas/ImpactFreshness' }
        created_at: { type: string, format: date-time }
        links:
          type: object
          required: [self, job, path_expansions, explanations]
          properties:
            self: { type: string, format: uri-reference }
            job: { type: string, format: uri-reference }
            path_expansions: { type: string, format: uri-reference }
            explanations: { type: string, format: uri-reference }
    ImpactPathExpansionRequest:
      type: object
      additionalProperties: false
      required: [target_node_id]
      properties:
        target_node_id: { type: string, minLength: 1 }
        max_paths: { type: integer, minimum: 1, maximum: 100, default: 20 }
    ImpactPathExpansion:
      type: object
      required: [report_id, expansion_hash, target_node_id, paths, truncation_reasons, warnings]
      properties:
        report_id: { $ref: '#/components/schemas/UUIDv7' }
        expansion_hash: { $ref: '#/components/schemas/Hash' }
        target_node_id: { type: string }
        paths: { type: array, items: { $ref: '#/components/schemas/ImpactPath' } }
        truncation_reasons: { type: array, items: { $ref: '#/components/schemas/ImpactTruncationReason' } }
        warnings: { type: array, items: { type: string } }
    ImpactExplanationRequest:
      type: object
      additionalProperties: false
      required: [evidence_refs]
      properties:
        evidence_refs: { type: array, minItems: 1, maxItems: 50, uniqueItems: true, items: { type: string } }
    ImpactExplanation:
      type: object
      required: [id, report_id, status, ai_generated, evidence_refs, created_at]
      properties:
        id: { $ref: '#/components/schemas/UUIDv7' }
        report_id: { $ref: '#/components/schemas/UUIDv7' }
        status: { type: string, enum: [queued, succeeded, failed] }
        ai_generated: { type: boolean, const: true }
        text: { type: string }
        provider: { type: string }
        model: { type: string }
        evidence_refs: { type: array, items: { type: string } }
        diagnostic: { type: string }
        created_at: { type: string, format: date-time }
    ImpactProblemCode:
      type: string
      enum: [INVALID_REVISION_PAIR, NO_BASELINE, GRAPH_NOT_READY, GRAPH_IDENTITY_MISMATCH, NODE_NOT_FOUND, LIMIT_EXCEEDED, GRAPH_STORE_UNAVAILABLE, SNAPSHOT_INDEX_NOT_READY, RETRIEVAL_UNAVAILABLE, PROVIDER_CONTRACT_MISMATCH, IDEMPOTENCY_CONFLICT, INTERNAL_ERROR]
    ProjectSelection:
      type: object
      required: [token, expires_at]
      properties:
        token: { type: string, minLength: 1, description: Opaque short-lived process-local capability. }
        expires_at: { type: string, format: date-time }
    OpenProjectRequest:
      type: object
      required: [selection_token, mode]
      properties:
        selection_token: { type: string }
        mode: { type: string, enum: [create, open] }
    Project:
      type: object
      required: [id, name, db_schema_version]
      properties:
        id: { $ref: '#/components/schemas/UUIDv7' }
        name: { type: string }
        db_schema_version: { type: integer, minimum: 1 }
    EntitySchema:
      type: object
      required: [kind, schema_id, schema, dsl_registry]
      properties:
        kind: { $ref: '#/components/schemas/EntityKind' }
        schema_id: { type: string, pattern: '^urn:eco:schema:' }
        schema: { type: object, additionalProperties: true }
        ui_hints: { type: object, additionalProperties: true }
        dsl_registry: { $ref: '#/components/schemas/DslRegistryMetadata' }
    DslRegistryMetadata:
      type: object
      required: [dsl_version, manifest_hash, selector_template, scopes, units, functions]
      description: Read-only metadata for suggestions. It contains no executable code.
      properties:
        dsl_version: { type: string }
        manifest_hash: { $ref: '#/components/schemas/Hash' }
        selector_template: { type: string, const: '${scope:symbol}' }
        scopes: { type: array, items: { type: string, enum: [self, source, target, scenario] } }
        units: { type: array, items: { $ref: '#/components/schemas/DslUnitMetadata' } }
        functions: { type: array, items: { $ref: '#/components/schemas/DslFunctionMetadata' } }
    DslUnitMetadata:
      type: object
      required: [name, value_type, dimension, base]
      properties:
        name: { type: string }
        value_type: { type: string, enum: [decimal, integer] }
        dimension: { type: string }
        base: { type: string }
    DslFunctionMetadata:
      type: object
      required: [name, signature, pure, implementation_version]
      properties:
        name: { type: string }
        signature: { type: string }
        pure: { type: boolean, const: true }
        implementation_version: { type: string }
    EntityStatus: { type: string, enum: [active, archived] }
    Entity:
      type: object
      required: [id, kind, key, name, tag_ids, status, schema_version, payload, extensions, entity_version, created_at, updated_at]
      properties:
        id: { $ref: '#/components/schemas/UUIDv7' }
        kind: { $ref: '#/components/schemas/EntityKind' }
        key: { type: string, minLength: 1, maxLength: 128, pattern: '^[a-z][a-z0-9_]*$' }
        name: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, maxLength: 10000 }
        tag_ids: { type: array, items: { $ref: '#/components/schemas/UUIDv7' } }
        balance_group: { type: string, maxLength: 128 }
        status: { $ref: '#/components/schemas/EntityStatus' }
        schema_version: { type: integer, const: 1 }
        payload: { $ref: '#/components/schemas/EntityPayload' }
        extensions: { type: object, additionalProperties: true, description: Namespaced opaque extension values. }
        entity_version: { type: integer, minimum: 1 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    EntityDraft:
      type: object
      required: [key, name, payload]
      properties:
        key: { type: string, minLength: 1, maxLength: 128, pattern: '^[a-z][a-z0-9_]*$' }
        name: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, maxLength: 10000 }
        tag_ids: { type: array, items: { $ref: '#/components/schemas/UUIDv7' }, default: [] }
        balance_group: { type: string, maxLength: 128 }
        payload: { $ref: '#/components/schemas/EntityPayload' }
        extensions: { type: object, additionalProperties: true, default: {} }
    EntityPatch:
      type: object
      additionalProperties: false
      properties:
        key: { type: string, minLength: 1, maxLength: 128, pattern: '^[a-z][a-z0-9_]*$' }
        name: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, maxLength: 10000 }
        tag_ids: { type: array, items: { $ref: '#/components/schemas/UUIDv7' } }
        balance_group: { type: string, maxLength: 128 }
        payload: { $ref: '#/components/schemas/EntityPayload' }
        extensions: { type: object, additionalProperties: true }
    EntityPayload:
      oneOf:
        - { $ref: '#/components/schemas/AttributePayload' }
        - { $ref: '#/components/schemas/TagPayload' }
        - { $ref: '#/components/schemas/CharacterPayload' }
        - { $ref: '#/components/schemas/SkillPayload' }
        - { $ref: '#/components/schemas/ItemPayload' }
        - { $ref: '#/components/schemas/EffectPayload' }
    AttributePayload:
      type: object
      required: [value_type, dimension, base_unit, default]
      properties:
        value_type: { type: string, enum: [integer, decimal, boolean] }
        dimension: { type: string }
        base_unit: { type: string }
        default: { oneOf: [{ $ref: '#/components/schemas/DecimalString' }, { type: boolean }] }
        min: { $ref: '#/components/schemas/DecimalString' }
        max: { $ref: '#/components/schemas/DecimalString' }
        display_scale: { $ref: '#/components/schemas/DecimalString' }
    TagPayload:
      type: object
      required: [category, parent_tag_ids]
      properties:
        category: { type: string }
        parent_tag_ids: { type: array, items: { $ref: '#/components/schemas/UUIDv7' } }
    FormulaBinding:
      type: object
      required: [output_attribute_id, expression]
      properties:
        output_attribute_id: { $ref: '#/components/schemas/UUIDv7' }
        expression: { type: string, minLength: 1 }
    FormulaValidationRequest:
      type: object
      additionalProperties: false
      required: [expression]
      properties:
        expression: { type: string, minLength: 1, maxLength: 10000 }
        output_attribute_id: { $ref: '#/components/schemas/UUIDv7' }
    FormulaDiagnostic:
      type: object
      additionalProperties: false
      required: [code, message, start_byte, end_byte]
      properties:
        code:
          type: string
          enum: [FORMULA_SYNTAX_INVALID, FORMULA_UNKNOWN_VARIABLE, FORMULA_UNKNOWN_FUNCTION, FORMULA_TYPE_MISMATCH, FORMULA_UNIT_MISMATCH, FORMULA_DIVISION_BY_ZERO, NUMERIC_NON_FINITE, NUMERIC_OUT_OF_RANGE]
        message: { type: string }
        start_byte: { type: integer, minimum: 0 }
