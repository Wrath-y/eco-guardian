      properties:
        backup_id: { $ref: '#/components/schemas/UUIDv7' }
        target_mode: { $ref: '#/components/schemas/RestoreTargetMode' }
        selection_token: { type: string, minLength: 32, maxLength: 256, description: One-use native directory-selection token; required only for empty_selection. }
        registry_confirmation_token: { type: string, minLength: 32, maxLength: 256, description: One-use explicit project-registration migration token. }
        preflight_generation: { $ref: '#/components/schemas/Hash' }
