openapi: 3.1.0
info: { title: local-rag impact query consumer contract, version: 1.0.0 }
paths:
  /v1/graphs/{namespace}/snapshots/{version}/traverse:
    post:
      parameters:
        - { name: namespace, in: path, required: true, schema: { type: string, minLength: 1 } }
        - { name: version, in: path, required: true, schema: { type: string, minLength: 1 } }
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/TraverseRequest' } } } }
      responses: { '200': { description: exact snapshot traversal, content: { application/json: { schema: { $ref: '#/components/schemas/TraverseResponse' } } } } }
  /v1/graphs/{namespace}/snapshots/{version}/paths:
    post:
      parameters:
        - { name: namespace, in: path, required: true, schema: { type: string, minLength: 1 } }
        - { name: version, in: path, required: true, schema: { type: string, minLength: 1 } }
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PathsRequest' } } } }
      responses: { '200': { description: provider-ranked paths, content: { application/json: { schema: { $ref: '#/components/schemas/PathsResponse' } } } } }
  /v1/graphs/{namespace}/snapshots/{version}/retrieve:
    post:
      parameters:
        - { name: namespace, in: path, required: true, schema: { type: string, minLength: 1 } }
        - { name: version, in: path, required: true, schema: { type: string, minLength: 1 } }
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RetrieveRequest' } } } }
      responses: { '200': { description: optional suspected evidence, content: { application/json: { schema: { $ref: '#/components/schemas/RetrieveResponse' } } } } }
components:
  schemas:
    Direction: { type: string, enum: [incoming, outgoing, both] }
    RelationKinds: { type: array, minItems: 1, maxItems: 1, prefixItems: [ { const: explicit } ] }
    TruncationReason: { type: string, enum: [MAX_DEPTH, MAX_NODES, MAX_PATHS] }
    QueryBase:
      type: object
      required: [namespace, snapshot_version, relationship_kinds]
      properties:
        namespace: { type: string, minLength: 1 }
        snapshot_version: { type: string, minLength: 1 }
        relationship_kinds: { $ref: '#/components/schemas/RelationKinds' }
        node_types: { type: array, uniqueItems: true, items: { type: string, minLength: 1 } }
        edge_types: { type: array, uniqueItems: true, items: { type: string, minLength: 1 } }
    TraverseRequest:
      allOf:
        - { $ref: '#/components/schemas/QueryBase' }
        - type: object
          required: [start_node_ids, direction, max_depth, max_nodes]
          properties:
            start_node_ids: { type: array, minItems: 1, uniqueItems: true, items: { type: string, minLength: 1 } }
            direction: { $ref: '#/components/schemas/Direction' }
            max_depth: { type: integer, minimum: 1, maximum: 6, default: 3 }
            max_nodes: { type: integer, minimum: 1, maximum: 500, default: 500 }
    TraverseResponse:
      type: object
      required: [resolved_snapshot_version, content_hash, nodes, edges, truncated, truncation_reasons, warnings]
      properties:
        resolved_snapshot_version: { type: string }
        content_hash: { type: string, pattern: '^[0-9a-f]{64}$' }
        nodes: { type: array, items: { type: object } }
        edges: { type: array, items: { type: object } }
        truncated: { type: boolean }
        truncation_reasons: { type: array, items: { $ref: '#/components/schemas/TruncationReason' } }
        warnings: { type: array, items: { type: string } }
    PathsRequest:
      allOf:
        - { $ref: '#/components/schemas/QueryBase' }
        - type: object
          required: [source_node_ids, target_node_ids, direction, max_depth, max_nodes, max_paths]
          properties:
            source_node_ids: { type: array, minItems: 1, uniqueItems: true, items: { type: string } }
            target_node_ids: { type: array, minItems: 1, uniqueItems: true, items: { type: string } }
            direction: { $ref: '#/components/schemas/Direction' }
            max_depth: { type: integer, minimum: 1, maximum: 6, default: 3 }
            max_nodes: { type: integer, minimum: 1, maximum: 500, default: 500 }
            max_paths: { type: integer, minimum: 1, maximum: 100, default: 20 }
    PathsResponse:
      type: object
      required: [resolved_snapshot_version, content_hash, paths, truncated, truncation_reasons, warnings]
      properties:
        resolved_snapshot_version: { type: string }
        content_hash: { type: string, pattern: '^[0-9a-f]{64}$' }
        paths: { type: array, items: { type: object } }
        truncated: { type: boolean }
        truncation_reasons: { type: array, items: { $ref: '#/components/schemas/TruncationReason' } }
        warnings: { type: array, items: { type: string } }
    RetrieveRequest:
      allOf:
        - { $ref: '#/components/schemas/QueryBase' }
        - type: object
          required: [query, max_seeds, max_results, graph_max_depth]
          properties:
            query: { type: string, minLength: 1, maxLength: 16384 }
            max_seeds: { type: integer, minimum: 1, maximum: 100 }
            max_results: { type: integer, minimum: 1, maximum: 100 }
            graph_max_depth: { type: integer, minimum: 0, maximum: 3 }
    RetrieveResponse:
      type: object
      required: [resolved_snapshot_version, content_hash, mode, degraded, warnings, results]
      properties:
        resolved_snapshot_version: { type: string }
        content_hash: { type: string, pattern: '^[0-9a-f]{64}$' }
        mode: { type: string, enum: [hybrid, bm25_only, vector_only, unavailable] }
        degraded: { type: boolean }
        warnings: { type: array, items: { type: string } }
        results: { type: array, items: { type: object } }
